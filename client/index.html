<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Eventon — Discover & register for events you'll remember</title>
    <meta
      name="description"
      content="Eventon is a modern event platform: discover hackathons, concerts, workshops and festivals, then register in seconds and get a QR ticket."
    />
    <meta name="theme-color" content="#152630" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fbf2e8" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Eventon — Events you'll remember" />
    <meta property="og:description" content="Discover events, register in seconds and carry your QR ticket everywhere." />
    <meta property="og:image" content="https://kexplore-events.vercel.app/og-image.jpg" />
    <meta property="og:url" content="https://kexplore-events.vercel.app" />
    <meta name="twitter:image" content="https://kexplore-events.vercel.app/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Apply the saved theme before first paint so there is no light/dark flash. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('kexplore:theme');
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <noscript>Eventon needs JavaScript enabled to run.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
