# Render Blueprint for the Kexplore API (https://render.com/docs/blueprint-spec)
services:
  - type: web
    name: kexplore-api
    runtime: node
    plan: free
    region: singapore # closest to the MongoDB Atlas cluster (AWS ap-southeast-1)
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '22'
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
